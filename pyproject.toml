[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-waf-sim"
version = "1.0.0"
description = "Page-mapped NAND flash simulator with greedy garbage collection and reproducible write-amplification experiments"
readme = "README.md"
authors = [
    { name = "Arnav Pandya" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["flash_sim*"]
exclude = ["tests*", "experiments*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

